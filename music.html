  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "x2ltfi5nrw");
  </script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title"><a href="./">Charlotte.</a></h1>
  </header>

  <main>
    <ul class="tree">
      <li><a href="./">← back</a></li>
      <li>music
        <input id="music-search" type="search" placeholder="filter by title, artist or genre…" autocomplete="off" aria-label="Filter songs" />
        <ul id="music-list" aria-busy="true">
          <li class="loading">Loading…</li>
        </ul>
      </li>
    </ul>
  </main>

  <script>
    (function () {
      var GENRES = ["pop", "rock", "metal & nu metal", "alternative & indie", "80s & 90s", "hip-hop & r&b",
        "electronic & dance", "jazz, soul & oldies", "classical", "piano & film scores", "uzbek & world"];
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      var list = document.getElementById('music-list');
      var search = document.getElementById('music-search');
      var songs = [];

      function songItem(s) {
        var by = s.artist ? ' <span class="dim">— ' + escapeHtml(s.artist) + '</span>' : '';
        return '<li><a href="/song/' + encodeURIComponent(s.id) + '">' + escapeHtml(s.title) + '</a>' + by + '</li>';
      }

      function group(name, items) {
        return '<li class="genre">' + escapeHtml(name) + ' <span class="dim">(' + items.length + ')</span><ul>' +
          items.map(songItem).join('') + '</ul></li>';
      }

      function render(items) {
        if (!items.length) {
          list.innerHTML = '<li class="dim">(no matches)</li>';
          return;
        }
        var html = '';
        var names = GENRES.slice();
        items.forEach(function (s) { if (s.genre && names.indexOf(s.genre) === -1) names.push(s.genre); });
        names.forEach(function (name) {
          var inGenre = items.filter(function (s) { return (s.genre || 'pop') === name; });
          if (inGenre.length) html += group(name, inGenre);
        });
        list.innerHTML = html;
      }

      function applyFilter() {
        var q = search.value.trim().toLowerCase();
        if (!q) { render(songs); return; }
        render(songs.filter(function (s) {
          return (s.title + ' ' + (s.artist || '') + ' ' + (s.genre || '')).toLowerCase().indexOf(q) !== -1;
        }));
      }

      search.addEventListener('input', applyFilter);

      fetch('music/index.json')
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (items) {
          songs = items.slice();
          if (!items.length) {
            list.innerHTML = '<li class="dim">(nothing yet)</li>';
          } else {
            applyFilter();
          }
          list.removeAttribute('aria-busy');
        })
        .catch(function (err) {
          list.innerHTML = '<li class="error">Couldn\'t load: ' + escapeHtml(err.message) + '</li>';
          list.removeAttribute('aria-busy');
        });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
