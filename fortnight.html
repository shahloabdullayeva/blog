<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fortnight · synced</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #161618;
    --border: #26262e;
    --border-strong: #34343f;
    --text: #f2f2f4;
    --text-muted: #b9b9c4;
    --text-sub: #6f6f7d;
    --accent: #8ec07c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
  }
  .player {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .head { display: flex; flex-direction: column; gap: 2px; }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .sub { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; margin-top: 2px; }
  .sub a { color: var(--accent); text-decoration: none; font-weight: 700; }

  .sync { display: flex; align-items: center; gap: 4px; margin-top: 8px; }
  .sync .label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-sub); font-weight: 700; margin-right: 2px; }
  .sync button {
    min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px;
    background: transparent; color: var(--text-sub);
    border: 1px solid var(--border); cursor: pointer;
    font-size: 11px; font-weight: 700; font-family: inherit;
  }
  .sync button:hover { color: var(--text-muted); border-color: var(--border-strong); }
  .sync .val { min-width: 42px; text-align: center; font-size: 10px; color: var(--text-muted); font-family: inherit; }

  .main { display: flex; gap: 16px; margin-top: 10px; }
  .video-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .video-frame {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--border-strong);
  }
  .video-frame > div { position: absolute; inset: 0; }
  .video-frame iframe { width: 100%; height: 100%; border: 0; }

  .lyrics-col {
    width: 38%; flex-shrink: 0; overflow-y: auto;
    padding: 20px 16px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    height: 480px; scrollbar-width: thin;
  }
  .lyrics-col .msg { color: var(--text-sub); font-size: 13px; text-align: center; margin-top: 40px; }
  .lines { display: flex; flex-direction: column; gap: 4px; }
  .lines button {
    text-align: left; background: transparent; border: none; cursor: pointer;
    padding: 6px 10px; border-radius: 8px; font-size: 15px; font-weight: 500;
    line-height: 1.4; color: var(--text-muted); transition: all 0.25s ease;
    font-family: inherit;
  }
  .lines button.past { color: var(--text-sub); }
  .lines button.active { color: var(--accent); font-weight: 700; font-size: 19px; }
  .plain {
    color: var(--text-muted); font-size: 15px; line-height: 1.8; margin: 0;
    white-space: pre-wrap; font-family: inherit;
  }

  @media (max-width: 760px) {
    .main { flex-direction: column; }
    .lyrics-col { width: 100%; height: 340px; border-radius: 14px; padding: 18px; }
    .lines button { text-align: center; font-size: 16px; padding: 9px 8px; }
  }
</style>
</head>
<body>
  <div class="player">
    <div class="head">
      <div class="title">Fortnight</div>
      <div class="sub">
        Taylor Swift ft. Post Malone · THE TORTURED POETS DEPARTMENT ·
        <a id="ytLink" href="#" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
      </div>
      <div class="sync">
        <span class="label">sync</span>
        <button id="m1" title="push lyrics 1s later">−1s</button>
        <button id="mp" title="push lyrics later">−</button>
        <span class="val" id="offVal">+0.0s</span>
        <button id="pp" title="pull lyrics earlier">+</button>
        <button id="p1" title="pull lyrics 1s earlier">+1s</button>
      </div>
    </div>

    <div class="main">
      <div class="video-col">
        <div class="video-frame"><div id="ytHost"></div></div>
      </div>
      <div class="lyrics-col" id="lyricsCol">
        <p class="msg">Loading lyrics…</p>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var YOUTUBE_ID = "q3zqJs7JUCQ"; // Fortnight (official video)
  var SONG = {
    artist: "Taylor Swift",
    title: "Fortnight",
    album: "THE TORTURED POETS DEPARTMENT",
    duration: 228
  };

  var BAKED_LRC = "";

  // Lyrics fire this many seconds relative to the video.
  // Negative = lyrics appear later (use this if they run ahead of the singing).
  var offset = 0;

  var lines = [];
  var activeIndex = -1;
  var player = null;
  var ready = false;
  var playing = false;
  var currentTime = 0;
  var pollId = null;

  var lyricsCol = document.getElementById("lyricsCol");
  document.getElementById("ytLink").href = "https://www.youtube.com/watch?v=" + YOUTUBE_ID;

  function fmtOffset(o) { return (o >= 0 ? "+" : "") + o.toFixed(1) + "s"; }
  function setOffset(o) { offset = Math.round(o * 10) / 10; document.getElementById("offVal").textContent = fmtOffset(offset); }
  document.getElementById("m1").onclick = function () { setOffset(offset - 1); };
  document.getElementById("mp").onclick = function () { setOffset(offset - 0.2); };
  document.getElementById("pp").onclick = function () { setOffset(offset + 0.2); };
  document.getElementById("p1").onclick = function () { setOffset(offset + 1); };
  setOffset(offset);

  function parseLRC(lrc) {
    var out = [];
    var re = /^\[(\d+):(\d+)(?:\.(\d+))?\](.*)$/;
    lrc.split("\n").forEach(function (raw) {
      var m = raw.match(re);
      if (!m) return;
      var ms = (m[3] || "0") + "000";
      ms = ms.slice(0, 3);
      var time = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + parseInt(ms, 10) / 1000;
      out.push({ time: time, text: (m[4] || "").trim() });
    });
    return out.sort(function (a, b) { return a.time - b.time; });
  }

  function loadLyrics() {
    if (BAKED_LRC && BAKED_LRC.trim()) {
      lines = parseLRC(BAKED_LRC);
      renderSynced();
      return;
    }
    var base = "https://lrclib.net/api/";
    var getUrl = base + "get?artist_name=" + encodeURIComponent(SONG.artist) +
      "&track_name=" + encodeURIComponent(SONG.title) +
      "&album_name=" + encodeURIComponent(SONG.album) +
      "&duration=" + SONG.duration;
    var searchUrl = base + "search?artist_name=" + encodeURIComponent(SONG.artist) +
      "&track_name=" + encodeURIComponent(SONG.title);

    fetch(getUrl)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (data) {
        if (data && data.syncedLyrics) return data;
        return fetch(searchUrl)
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (arr) {
            arr = arr || [];
            return arr.filter(function (x) { return x.syncedLyrics; })[0] || arr[0] || null;
          })
          .catch(function () { return null; });
      })
      .then(function (data) {
        if (!data) { showMsg("Couldn't fetch lyrics for this song."); return; }
        if (data.syncedLyrics) { lines = parseLRC(data.syncedLyrics); renderSynced(); return; }
        if (data.plainLyrics) { renderPlain(data.plainLyrics); return; }
        showMsg("No synced lyrics found.");
      });
  }

  function showMsg(text) { lyricsCol.innerHTML = '<p class="msg"></p>'; lyricsCol.querySelector(".msg").textContent = text; }

  function renderPlain(text) {
    lyricsCol.innerHTML = '<pre class="plain"></pre>';
    lyricsCol.querySelector(".plain").textContent = text;
  }

  function renderSynced() {
    if (!lines.length) { showMsg("No synced lyrics found."); return; }
    var wrap = document.createElement("div");
    wrap.className = "lines";
    lines.forEach(function (ln, i) {
      var b = document.createElement("button");
      b.textContent = ln.text || " ";
      b.setAttribute("data-i", i);
      b.title = "Jump to " + Math.floor(ln.time / 60) + ":" + String(Math.floor(ln.time % 60)).padStart(2, "0");
      b.onclick = function () { if (player && player.seekTo) player.seekTo(Math.max(0, ln.time - 0.2), true); };
      wrap.appendChild(b);
    });
    lyricsCol.innerHTML = "";
    lyricsCol.appendChild(wrap);
  }

  function updateActive() {
    if (!lines.length) return;
    var target = currentTime + offset;
    var lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (lines[mid].time <= target) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (ans === activeIndex) return;
    activeIndex = ans;
    var btns = lyricsCol.querySelectorAll(".lines button");
    btns.forEach(function (b, i) {
      b.className = i === activeIndex ? "active" : (i < activeIndex ? "past" : "");
    });
    var el = lyricsCol.querySelector('.lines button[data-i="' + activeIndex + '"]');
    if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function startPolling() {
    if (pollId) return;
    pollId = setInterval(function () {
      if (player && player.getCurrentTime) {
        var t = player.getCurrentTime();
        if (typeof t === "number") { currentTime = t; updateActive(); }
      }
    }, 200);
  }
  function stopPolling() { if (pollId) { clearInterval(pollId); pollId = null; } }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("ytHost", {
      videoId: YOUTUBE_ID,
      playerVars: { rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onReady: function () { ready = true; },
        onStateChange: function (e) {
          playing = e.data === 1;
          if (playing) startPolling(); else stopPolling();
        }
      }
    });
  };

  (function loadApi() {
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.async = true;
    document.head.appendChild(tag);
  })();

  loadLyrics();
})();
</script>
</body>
</html>
